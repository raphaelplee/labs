server:
  forward-headers-strategy: native

spring:
  application:
    name: transflow-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transflow
  flyway:
    schemas: transflow
    default-schema: transflow
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete
  data:
    web:
      pageable:
        max-page-size: 100
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers:
      - task-queue: ${temporal.task-queue:subscription-saga-queue}
        workflow-classes:
          - de.raphaellee.transflow.orchestration.SubscriptionSagaWorkflowImpl

temporal:
  task-queue: subscription-saga-queue

saga:
  fulfillment-timeout-seconds: ${SAGA_FULFILLMENT_TIMEOUT_SECONDS:30}
  payment-timeout-seconds: ${SAGA_PAYMENT_TIMEOUT_SECONDS:600}

springdoc:
  api-docs:
    path: /api-docs
    version: openapi_3_1
  swagger-ui:
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  writer-with-default-pretty-printer: true
  override-with-generic-response: false
