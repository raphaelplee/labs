server:
  forward-headers-strategy: native  # trust X-Forwarded-Proto from Caddy reverse proxy

spring:
  application:
    name: transflow-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transflow
  flyway:
    schemas: transflow
    default-schema: transflow
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "de.raphaellee.transflow.*"
        spring.json.use.type.headers: false  # Spring Modulith publishes with [B type header; use listener method type instead
        max.poll.interval.ms: 60000   # allows up to 60s processing; fulfillment-timeout scenario sleeps 35s
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer  # Spring Modulith serializes events to JSON String first; StringSerializer sends raw JSON bytes
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers:
      - task-queue: ${temporal.task-queue:subscription-saga-queue}
        workflow-classes:
          - de.raphaellee.transflow.orchestration.SubscriptionSagaWorkflowImpl

temporal:
  task-queue: subscription-saga-queue

saga:
  fulfillment-timeout-seconds: ${SAGA_FULFILLMENT_TIMEOUT_SECONDS:30}

springdoc:
  api-docs:
    path: /api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui/index.html
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  writer-with-default-pretty-printer: true
  override-with-generic-response: false  # prevent GlobalExceptionHandler responses from being injected into every endpoint
