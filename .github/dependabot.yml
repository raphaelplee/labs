version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: docker-compose
    directory: "/compose"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "ghcr.io/raphaelplee/transflow-core"
